[package]
name = "duaa"
version = "0.1.0"
edition = "2021"
description = "Automated BUAA iclass check-in daemon supporting official 8081 signed check-in and 8082 fallback"
license = "MIT"

[[bin]]
name = "duaa"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "query", "form", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rand = "0.9"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
dashmap = "6"
hmac = "0.12"
sha2 = "0.10"
